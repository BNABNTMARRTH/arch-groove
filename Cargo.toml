[workspace]
resolver = "2"
members = [
    "crates/asahi-fan-control",
    "crates/asahi-power-profile",
    "crates/asahi-battery-limiter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arch Linux Mac Rust Project"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

