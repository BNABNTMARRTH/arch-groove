#
# /etc/pacman.conf for Arch Linux ARM on Apple Silicon
#
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Asahi Linux repositories (Kernels, m1n1, mesa, audio DSP)
[asahi]
Server = https://asahi-linux.org/repo/$arch

# Arch Linux ARM official mirrors
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

